name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 80 build.log
          if [ $code -ne 0 ]; then
            grep -vE "^> Task" build.log | grep -E "^e: |error:|ERROR:|What went wrong|Exception|Could not|^> " | head -n 9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: FujiSimCam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
